[package]
name = "trust-deeds-pg-to-turso"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# This manifest is deliberately standalone. Do not add it to the application or
# repository workspace: PostgreSQL and SQLite export dependencies must never
# enter the Vercel function graph.

[dependencies]
anyhow = "1"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "postgres", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
